[package]
name = "skulld-clip-forge"
version = "0.1.0"
description = "Local-first desktop utility for branded vertical gameplay clips"
authors = ["Skull'd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "skulld_clip_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
wait-timeout = "0.2"
webbrowser = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
